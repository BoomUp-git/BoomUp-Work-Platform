<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}BoomUp Work Platform{% endblock %}</title>
  <link rel="icon" type="image/png" sizes="64x64" href="/static/boomup-favicon.png?v=20260827-3">
  <link rel="stylesheet" href="/static/app.css?v=20260828-4">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
    <a class="brand" href="/"><span class="brand-mark">B</span><span>BoomUp</span><span class="brand-muted">Work Platform</span></a>
    <nav aria-label="Primary navigation">
      <a class="{{ 'active' if request.url.path.startswith('/invoice-price-check') else '' }}" href="/invoice-price-check">{{ "发票价格检查" if zh_ui|default(false) else "Invoice Price Check" }}</a>
    </nav>
    </div>
  </header>
  <main class="page-shell">
    {% block content %}{% endblock %}
  </main>
  {% if zh_ui|default(false) %}
  <aside class="mascot-helper" data-mascot-state="idle" aria-live="polite">
    <div class="mascot-message" hidden>
      <strong class="mascot-message-title">考拉小助手</strong>
      <span class="mascot-message-text">需要我时，点一下我就好。</span>
      <button class="mascot-message-close" type="button" aria-label="关闭提醒">×</button>
    </div>
    <button class="floating-koala" type="button" aria-label="打开考拉小助手提醒" aria-expanded="false">
      <img src="/static/koala-mascot-v2.png" alt="">
      <span class="mascot-alert-dot" hidden></span>
    </button>
  </aside>
  <script src="/static/mascot.js" defer></script>
  {% endif %}
  {% block scripts %}{% endblock %}
</body>
</html>
